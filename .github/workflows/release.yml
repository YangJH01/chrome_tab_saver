name: Release Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (example: 0.1.0)"
        required: true
      release_name:
        description: "Optional release title"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
            TITLE="${{ github.event.inputs.release_name }}"
            if [ -z "$TITLE" ]; then
              TITLE="Tab Save ${TAG}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            TITLE="Tab Save ${TAG}"
          fi

          ASSET="tab-save-${VERSION}.zip"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: |
          cd dist
          zip -r "../${{ steps.meta.outputs.asset }}" .

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.meta.outputs.asset }}
          generate_release_notes: true
          prerelease: false

